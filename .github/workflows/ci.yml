name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check llmsec/ tests/ control/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: llmsec/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r llmsec/requirements.txt
          pip install pytest pytest-xdist pytest-cov pip-audit
          # TUI 测试依赖可选 [tui] extra（pyproject）；不进 requirements.txt——
          # 该文件面向 Docker/Web 部署，TUI 仅终端侧需要
          pip install "textual>=1,<4"
      - name: Run tests
        # -n 4（与 pyproject addopts 同值）：-n auto(=12 核)下 worker 冷启动开销
        # 远超并行收益（pyproject 注释有实测数据：130s vs 37s）
        run: python -m pytest tests/ -q -n 4 --tb=short --cov=llmsec --cov-report=term-missing
        env:
          PYTHONIOENCODING: utf-8
      - name: Test inventory up-to-date
        # tests/INVENTORY.md 的用例数表由脚本生成，与实际收集不一致即失败
        # （防 README/清单里的数字随测试演进腐烂）
        run: python scripts/gen_test_inventory.py --check
        env:
          PYTHONIOENCODING: utf-8
      - name: Dependency audit
        run: pip-audit -r llmsec/requirements.txt
        continue-on-error: true

  docker:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push full
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            jinxiahz/llmsec:latest
            jinxiahz/llmsec:${{ github.sha }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,scope=full,mode=max
      - name: Build & push slim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.slim
          platforms: linux/amd64
          push: true
          tags: |
            jinxiahz/llmsec:slim
            jinxiahz/llmsec:slim-${{ github.sha }}
          cache-from: type=gha,scope=slim
          cache-to: type=gha,scope=slim,mode=max
