name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check llmsec/ tests/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: llmsec/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r llmsec/requirements.txt
          pip install pytest pytest-xdist pytest-cov pip-audit
      - name: Run tests
        run: python -m pytest tests/ -q -n auto --tb=short --cov=llmsec --cov-report=term-missing
        env:
          PYTHONIOENCODING: utf-8
      - name: Dependency audit
        run: pip-audit -r llmsec/requirements.txt
        continue-on-error: true

  docker:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push full
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            jinxiahz/llmsec:latest
            jinxiahz/llmsec:${{ github.sha }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,scope=full,mode=max
      - name: Build & push slim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.slim
          platforms: linux/amd64
          push: true
          tags: |
            jinxiahz/llmsec:slim
            jinxiahz/llmsec:slim-${{ github.sha }}
          cache-from: type=gha,scope=slim
          cache-to: type=gha,scope=slim,mode=max
