# docker-compose: 一键启动 LLMSEC Web 面板
#
# 用法：
#   1. 复制 .env.example 为 .env，填入 API 密钥
#   2. docker compose up
#   3. 浏览器打开 http://localhost:8080
#
# 镜像选择：
#   jinxiahz/llmsec:latest — 完整版（含聚类 + torch，~3GB）
#   jinxiahz/llmsec:slim   — 精简版（不含聚类，~500MB）
# 本地构建：注释 image 行，取消 build 行注释

services:
  llmsec:
    image: jinxiahz/llmsec:latest
    # build: .
    ports:
      - "8080:8080"
    volumes:
      - ./output:/app/output
      - ./attacks:/app/attacks
      - ./data:/app/data:ro
      - ./.env:/app/.env:ro
    environment:
      - PYTHONIOENCODING=utf-8
    restart: unless-stopped
