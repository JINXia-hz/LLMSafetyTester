name: Dependency Audit

# 依赖审计分车道：
#   - PR 车道（ci.yml）：advisory——pip-audit 失败不拦合并，避免随机出现的
#     传递依赖漏洞阻塞日常开发
#   - 本工作流（每周一 03:00 UTC + 手动触发）：blocking——同样失败这里会红，
#     强制定期面对漏洞存量；确认不可利用/等待上游的条目进白名单并带复审期
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: llmsec/requirements.txt
      - name: pip-audit (blocking)
        run: |
          pip install pip-audit
          # 白名单文件：每行 "<漏洞ID>  # 原因 + 复审截止"，注释/空行跳过
          IGNORE_ARGS=$(grep -vE '^[[:space:]]*(#|$)' .github/pip-audit-allowlist.txt \
            | awk '{print $1}' | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          pip-audit -r llmsec/requirements.txt $IGNORE_ARGS
