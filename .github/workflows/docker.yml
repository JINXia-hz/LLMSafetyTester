name: Docker

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 完整版（含聚类 + torch + 预缓存 embedding 模型，~3GB）
      - name: Build & push full
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            jinxiahz/llmsec:latest
            jinxiahz/llmsec:${{ github.sha }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,scope=full,mode=max

      # 精简版（不含聚类/torch，~500MB）
      - name: Build & push slim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.slim
          platforms: linux/amd64
          push: true
          tags: |
            jinxiahz/llmsec:slim
            jinxiahz/llmsec:slim-${{ github.sha }}
          cache-from: type=gha,scope=slim
          cache-to: type=gha,scope=slim,mode=max
