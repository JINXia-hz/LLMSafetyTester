[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsec"
version = "1.0.0"
description = "LLM 红队攻击测试工具——自适应评估、聚类分析、ELO 收敛"
requires-python = ">=3.11"
dependencies = [
    # 核心：API 客户端 + Web 面板 + ELO/评估数学库
    "openai>=2,<3",
    "python-dotenv>=1,<2",
    "requests>=2,<3",
    "urllib3>=2,<3",
    "fastapi>=0.100,<1",
    "uvicorn>=0.20,<1",
    "pydantic>=2,<3",
    "jinja2>=3,<4",
    "python-multipart>=0.0.6",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "optuna>=3,<4",
    "pyyaml>=6,<7",
    # 控制层（control/）跨进程文件锁——workspace/env_snapshot/gazette 的索引 RMW
    "filelock>=3,<4",
]

[project.optional-dependencies]
# 聚类增强（hdbscan + sentence-transformers + tiktoken）
# sentence-transformers 会拉入 torch（~2GB），仅聚类特征提取需要
# 安装：pip install -e ".[cluster]" 或 pip install llmsec[cluster]
cluster = [
    "hdbscan>=0.8,<0.9",
    "sentence-transformers>=2",
    "tiktoken>=0.5",
]
# 开发：测试 + lint
dev = [
    "pytest>=8,<9",
    "pytest-xdist>=3",
    "ruff",
]
# MCP 工具库接口（llmsec-mcp server，供外部 agent 调用）
# 安装：pip install -e ".[mcp]"
mcp = [
    "fastmcp>=2,<4",
]
# 终端界面（llmsec-tui，Textual）
# 安装：pip install -e ".[tui]"
tui = [
    "textual>=1,<4",
]

[project.scripts]
llmsec = "llmsec.pipeline.runner:main"
llmsec-manage = "llmsec.management.__main__:main"
llmsec-mcp = "llmsec.mcp.server:main"
llmsec-tui = "llmsec.tui.app:main"

[tool.setuptools.packages.find]
# control 必须入包：llmsec.server.dashboard_api 模块级 import 并注册 control.router，
# 缺了它非可编辑安装（pip install llmsec）的 dashboard 直接 ImportError
include = ["llmsec*", "control*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "output", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, undefined names, etc.)
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax)
    "B",    # bugbear (common bug patterns)
    "SIM",  # simplify (redundant code)
]
ignore = [
    "E501",   # line too long（120 行宽已设，超长行多为中文注释/字符串）
    "E402",   # module import not at top（llmsec 大量函数内 lazy import 防循环依赖）
    "B008",   # do not perform function call in argument defaults（FastAPI Depends 模式）
    "B904",   # raise without from（except 块内 raise 包装，部分需 from None）
    "B905",   # zip without explicit strict（项目内 zip 语义清晰）
    "B027",   # empty method without abstract decorator（ABC 模式，非强制）
    "SIM103", # needless-bool（可读性优先）
    "SIM108", # if-else-block-instead-of-if-exp（多行注释需要 if-else 块）
    "SIM117", # nested with（io.py 的锁+文件句柄需要嵌套）
    "SIM112", # uncapitalized environment variables（TARGET_x_* 是故意的 nm.lower() 约定）
    "SIM102", # collapsible-if（合并后可读性下降）
    "SIM105", # suppressible-exception（contextlib.suppress 会吞掉栈信息，调试不便）
    "SIM115", # open-file-with-context-manager（文件锁需要手动控制生命周期）
    "SIM116", # if-else-block-instead-of-dict-lookup（中文文案 if-else 更可读）
    "SIM118", # in-dict-keys（dict.keys() 在迭代场景更明确）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E402",   # 测试中 mock 后再 import
    "E741",   # 模糊变量名 l（list comprehension 中常用）
    "B007",   # 未使用循环变量 i（enumerate 常见）
    "B011",   # assert False（测试中故意触发失败）
    "SIM105", # try/except/pass（测试中验证异常路径）
    "SIM201", # not x == y 风格（测试断言习惯）
    "SIM202", # not x != y 风格（测试断言习惯）
    "SIM108", # if-else vs if-exp（测试可读性优先）
    "SIM115", # open file without context manager（测试临时文件）
    "UP031",  # printf-style % 格式（旧式测试）
]

[tool.ruff.lint.isort]
known-first-party = ["llmsec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# -m 'not real_api and not e2e'：默认排除真实 API / 端到端测试（产生费用、需凭证、
# 分钟级延迟）。这些测试仅在显式 `pytest -m real_api` / `pytest -m e2e` 时才跑，
# 保证 `pytest tests/` 行为与离线套件完全一致。
addopts = "--tb=short -n 4 -m 'not real_api and not e2e'"
markers = [
    "real_api: 真实外部 API 测试（产生费用/延迟，默认不跑；手动 pytest -m real_api 触发）",
    "e2e: 端到端全流程测试（含子进程 + 真实 API，默认不跑；手动 pytest -m e2e 触发）",
]
# -n 4 而非 -n auto：本套件是"海量毫秒级小测试 + 少数聚类重测试"分布，
# worker 冷启动 + import llmsec/numpy/sklearn 的固定开销约 5-6s/worker，
# -n auto(=12 逻辑核)下该开销远超并行收益（实测 130s vs 串行 37s）。
# -n 4 实测 ~28s，兼顾并行加速与启动开销。临时禁用并行：pytest -p no:xdist
# 自动过滤无害的第三方库 warning（避免干扰"是否全过"的判断）：
#   - starlette/httpx TestClient 弃用告警（测试工具链，与业务无关）
#   - scipy/sklearn 在退化输入（零方差组、单样本 PCA）上的数值 RuntimeWarning；
#     代码侧已用 _finite / 退化列守卫处理结果，仅是第三方库对退化输入的提示
filterwarnings = [
    # starlette/httpx TestClient 弃用告警（StarletteDeprecationWarning 类别跨版本不稳定，按消息匹配）
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:invalid value encountered in scalar divide:RuntimeWarning",
    "ignore:invalid value encountered in divide:RuntimeWarning",
    # sklearn KMeans 在退化数据（< n_clusters 个不同点）上的 ConvergenceWarning（预聚类用，无害）
    "ignore:Number of distinct clusters.*found smaller than n_clusters",
]
